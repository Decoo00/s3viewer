<!DOCTYPE html>
<html>
<head>
    <title>FBX Web Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; }
        #version { font-size: 12px; opacity: 0.7; }
        #side-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: sans-serif;
            overflow-y: auto;
        }
        #model-list { list-style: none; padding: 0; }
        #model-list li {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #444;
            transition: background 0.2s;
        }
        #model-list li:hover { background: #555; }
        #color-picker-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-family: sans-serif;
        }
        #team-color-input {
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
            background: none;
        }

        #category-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #category-bar {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .cat-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #333;
            background-size: 80%; /* 아이콘 크기 조절 */
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .cat-btn:hover {
            transform: scale(1.1) translateY(-5px);
            border-color: #f0fd01; /* 스플래툰 옐로우 */
        }

        #controls-help {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7); /* 반투명 검은색 */
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Pretendard', sans-serif;
            font-size: 14px;
            pointer-events: none; /* 마우스 클릭이 가이드를 통과해 캔버스로 전달되게 함 */
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #controls-help h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ffd400; /* 스플래툰 느낌의 노란색 포인트 */
        }

        #controls-help ul {
            list-index: none;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #controls-help li {
            margin-bottom: 5px;
        }

        #controls-help strong {
            color: #00ffcc; /* 하늘색 포인트 */
        }
    </style>
</head>
<body>
    <div id="info">Splatoon 3 Weapon Viewer<div id="version">v0.1</div></div>
    <div id="side-panel">
        <h2 id="list-title">무기</h2> 
        <ul id="model-list"></ul>
    </div>
    <div id="category-wrapper">
        <div id="category-bar"></div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
        <div id="controls-help">
        <h3>🎮 조작 가이드 🎮</h3>
        <ul>
            <li><strong>회전:</strong> 마우스 왼쪽 클릭 드래그</li>
            <li><strong>이동:</strong> 마우스 오른쪽 클릭 드래그</li>
            <li><strong>확대/축소:</strong> 마우스 휠</li>
            <li><strong>잉크 색상 변경:</strong> 우하단 컬러 피커 활용</li>
        </ul>
    </div>
    <script type="module" src="main.js"></script>
    <div id="color-picker-container">
        <label>잉크 색</label>
        <input type="color" id="team-color-input" value="#ff00ff">
    </div>
</body>
</html>

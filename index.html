<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Splatoon 3 Web Viewer</title>
    <link rel="apple-touch-icon" sizes="57x57" href="favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="manifest" href="favicon/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <style>
        /* 언어별 글꼴 (i18n.js가 <html lang>을 바꿈). 쓰는 글꼴만 받아짐. 글리프가 없는 글자는 시스템 글꼴로 */
        /* AsiaKERIN은 같은 글자 크기에서 글자가 작게 보여서 키움: 한글 글자 평균 높이 65 → Kurokane(en·ja 일반) 가나 76에 맞춰 117% (canvas로 측정) */
        @font-face { font-family: 'AsiaKERIN'; src: url('font/AsiaKERIN-M.ttf') format('truetype'); font-display: swap; size-adjust: 117%; }
        @font-face { font-family: 'Kurokane'; src: url('font/FOT-KurokaneStd-EB.otf') format('opentype'); font-display: swap; }
        :root { --font: 'AsiaKERIN', sans-serif; --font-bold: 'AsiaKERIN', sans-serif; } /* 한국어는 일반·볼드 모두 AsiaKERIN */
        :root:is([lang="en"], [lang="ja"]) { --font: 'Kurokane', sans-serif; --font-bold: 'Kurokane', sans-serif; /* en·ja는 일반·볼드 모두 Kurokane */ }
        body { font-family: var(--font); }
        button, select, input { font-family: inherit; }
        h2, h3, strong, #info, #rotation-panel label { font-family: var(--font-bold); }
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
        /* 렌더러는 투명 배경을 그릴 수 있게 alpha: true. 평소엔 배경이 불투명이라 안 보이고, 움짤 녹화 중(투명 배경으로 그림)에만 체크무늬가 보임 */
        body > canvas, #ed-preview { background: repeating-conic-gradient(#8a8a8a 0 25%, #b0b0b0 0 50%) 0 0 / 20px 20px; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; }
        #version { font-size: 12px; opacity: 0.7; }
        /* 화면 위에 겹치는 UI 레이어: 위쪽은 무기 목록, 아래쪽은 하단 바. 서로 영역을 나눠 가져서 겹치지 않음 */
        #ui {
            position: fixed;
            inset: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            pointer-events: none; /* 빈 영역 클릭은 캔버스로 통과 */
        }
        #bottom-bar {
            align-self: stretch;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        #side-panel, #category-bar, #color-picker-container, #rotation-panel, #light-panel, #shader-panel, #anim-bar, #char-bar, #export-panel { pointer-events: auto; }
        #category-wrap { position: relative; max-width: 100%; } /* 카테고리 바: 넓은 화면에선 원래 폭 그대로 가운데, 좁으면 화면 폭 전체까지 (다른 패널 자리를 비켜 주지 않음). animBar의 max-width 기준 */
        /* 카테고리 바 바로 위에 캐릭터 바, 그 아래 애니메이션 바를 띄움. 레이아웃 높이에 넣지 않음 (나타나고 사라져도 좌측 패널·잉크 색 위치가 그대로) */
        #above-bar {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* 가운데 정렬 */
            gap: 10px;
            pointer-events: none;
        }
        #anim-bar, #char-bar { /* 임시: 모델 애니메이션 조작 */
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: auto; /* 폭이 모자라면 카테고리 바처럼 가로 스크롤 */
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-family: var(--font);
            font-size: 14px;
        }
        #anim-bar > * { flex-shrink: 0; }
        #anim-bar[hidden], #anim-bar [hidden] { display: none; }
        /* 우측 패널 묶음: 셰이더·저장·조명·회전을 한 줄로 세로로 쌓고, 아래쪽을 우하단 잉크 색 패널 바로 위에 맞춤 (bottom·max-height는 main.js에서 계산)
           화면 높이가 모자라면 셰이더 패널만 줄어들고 그 안에서 스크롤 (픽셀 옵션이 펼쳐져도 화면 위로 넘치지 않음) */
        #right-stack {
            position: absolute;
            right: 20px;
            bottom: 150px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }
        #right-stack > * { flex-shrink: 0; }
        /* 셰이더 패널은 안쪽(.panel-scroll)만 스크롤: 패널 자체에 overflow를 걸면 바깥에 붙은 숨기기 버튼이 잘림 */
        #right-stack > #shader-panel { flex-shrink: 1; min-height: 0; display: flex; flex-direction: column; }
        #shader-panel .panel-scroll { min-height: 0; overflow-y: auto; }
        #shader-panel label, #light-panel label { display: block; }
        #shader-panel [hidden] { display: none; }
        #export-panel { display: flex; flex-direction: column; gap: 6px; }
        #export-panel [hidden] { display: none; }
        #export-panel .row { display: flex; align-items: center; gap: 6px; }
        #rec-length { width: 52px; }
        #rec-start.recording { background: #c0392b; color: white; }
        #shader-panel, #light-panel, #export-panel {
            position: relative; /* 숨기기 버튼 기준 */
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 14px;
        }
        #rotation-panel {
            position: relative; /* 숨기기 버튼 기준 */
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 14px;
        }
        #rotation-panel label { display: flex; align-items: center; gap: 6px; font-weight: bold; }
        #rotation-panel input { width: 56px; }
        #rotation-panel input[type="range"] { width: 90px; }
        #rotation-panel [hidden] { display: none; } /* label의 display: flex가 hidden 속성을 덮어쓰지 않도록 */
        #rotation-panel .axis-x { color: #ff5a5a; }
        #rotation-panel .axis-y { color: #6ee36e; }
        #rotation-panel .axis-z { color: #5aa0ff; }
        #side-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 240px;
            max-height: 50vh; /* 무기 목록 높이 (사용자 요청으로 줄임). 목록은 내부 스크롤 */
            min-height: 0; /* 남은 높이보다 길면 줄어들고, 목록만 내부 스크롤 */
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: var(--font);
        }
        /* 스크롤바는 숨김 (휠·터치 스와이프·마우스 드래그로 스크롤, main.js) */
        #model-list { list-style: none; padding: 0; overflow-y: auto; min-height: 0; scrollbar-width: none; }
        #model-list::-webkit-scrollbar { display: none; }
        #model-list li { user-select: none; } /* 드래그 스크롤 중 글자 선택 방지 */

        /* 숨기기/펼치기: collapsed면 자기 폭 + 화면 여백(20px)만큼 옆으로 빠지고, 버튼은 패널 바깥 모서리에 붙어서 화면 끝에 남음 */
        .collapsible { transition: translate 0.3s ease; }
        .collapsible.left.collapsed { translate: calc(-100% - 20px) 0; }
        .collapsible.right.collapsed { translate: calc(100% + 20px) 0; }
        .toggle-btn {
            position: absolute;
            top: 10px;
            width: 24px;
            height: 44px;
            padding: 0;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }
        .left .toggle-btn { left: 100%; border-radius: 0 6px 6px 0; }
        .right .toggle-btn { right: 100%; border-radius: 6px 0 0 6px; }
        .toggle-btn::before { content: '<'; display: inline-block; transition: transform 0.3s; }
        .right .toggle-btn::before { content: '>'; }
        .collapsed .toggle-btn::before { transform: rotate(180deg); }

        #model-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #444;
            transition: background 0.2s;
        }
        #model-list li:hover { background: #555; }
        #model-list li img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        /* 언어 선택: 좌하단 구석 (카테고리 바가 잉크 색 패널 폭만큼 양쪽을 비워 둔 자리) */
        /* 좌측 아래 잉크 색 패널 자리: #ui 세로 흐름에서 하단 바 바로 위 (margin-top: auto로 아래쪽에 붙고, 무기 목록은 남은 높이 안에서 줄어듦) */
        #left-bottom { margin-top: auto; flex-shrink: 0; }
        /* 일시정지: 무기·캐릭터 애니메이션 전부. 무기와 상관없이 늘 보임 (잉크·배경 색 패널 바로 위) */
        #anim-pause { display: block; margin-bottom: 8px; pointer-events: auto; font-family: var(--font); }
        /* 우측 최상단: 저작권 표기·문의 (상자 없이 작은 회색 글자 한 줄씩), 그 아래 언어 선택. 우측 패널 묶음은 이 아래부터 (main.js placeRightStack) */
        #top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: calc(100% - 40px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            text-align: right;
        }
        #top-right .note { color: #666; font-size: 10px; white-space: nowrap; } /* 기본 배경(#a0a0a0) 위에서 보이는 진한 회색 */
        /* 좁은 화면: 무기 목록과 겹치지 않게 세로 흐름의 맨 위(제목 아래)에 두고, 긴 줄은 줄바꿈 */
        @media (max-width: 600px) {
            #top-right { position: static; align-self: flex-end; margin-top: 30px; flex-shrink: 0; }
            #top-right .note { white-space: normal; }
        }
        #lang-picker {
            display: flex;
            gap: 4px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            pointer-events: auto;
        }
        .lang-btn {
            display: flex;
            padding: 3px;
            border: 2px solid transparent;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            opacity: 0.6;
        }
        .lang-btn:hover { opacity: 1; }
        .lang-btn.active { opacity: 1; border-color: #f0fd01; }
        .lang-btn img { width: 24px; height: 24px; object-fit: contain; }
        /* 잉크 색 패널은 좌측 열 아래 (#left-bottom 안) */
        #bottom-bar { position: relative; }
        #color-picker-container {
            position: relative; /* 숨기기 버튼 기준 */
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-family: var(--font);
        }
        /* 잉크 색·배경 색을 옆으로 나란히 (세로로 쌓으면 위쪽 우측 패널이 화면 밖으로 밀림) */
        #color-picker-container .color-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        #color-picker-container [hidden] { display: none; }
        /* 캐릭터 피부·눈 프리셋: 버튼을 누르면 위로 견본 격자가 뜸 */
        .preset-button { width: 44px; height: 44px; margin: 3px; border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 4px; cursor: pointer; padding: 0; }
        .preset-palette {
            position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 20;
            display: grid; grid-template-columns: repeat(7, 28px); gap: 6px;
            background: rgba(0, 0, 0, 0.85); padding: 10px; border-radius: 10px;
        }
        .preset-palette[hidden] { display: none; }
        .preset-swatch { width: 28px; height: 28px; border: 2px solid transparent; border-radius: 50%; cursor: pointer; padding: 0; }
        .preset-swatch.active { border-color: #f0fd01; }
        #team-color-input, #bg-color-input {
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
            background: none;
        }

        #category-bar {
            display: flex;
            box-sizing: border-box;
            max-width: 100%;
            overflow-x: auto; /* 폭이 모자라면 가로 스크롤 */
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .cat-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #333;
            background-size: 80%; /* 아이콘 크기 조절 */
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .cat-btn:first-child { margin-left: auto; }
        .cat-btn:last-child { margin-right: auto; }
        .cat-btn:hover {
            transform: scale(1.1) translateY(-5px);
            border-color: #f0fd01; /* 스플래툰 옐로우 */
        }
        /* 선택 중인 카테고리: 노란 테두리와 빛 번짐을 유지하고 살짝 떠 있게 */
        .cat-btn.active {
            transform: translateY(-5px);
            border-color: #f0fd01;
            background-color: #4a4a1a;
            box-shadow: 0 0 0 2px rgba(240, 253, 1, 0.35), 0 0 8px 2px rgba(240, 253, 1, 0.55);
        }
        .cat-btn.active:hover { transform: scale(1.1) translateY(-5px); }

        /* 움짤 시퀀스 편집기 */
        #export-editor {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            font-family: var(--font);
            font-size: 14px;
            color: white;
        }
        #export-editor[hidden] { display: none; }
        #export-editor .ed-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(960px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            box-sizing: border-box;
            padding: 16px;
            background: #222;
            border-radius: 10px;
        }
        #export-editor .ed-view { display: flex; justify-content: center; min-height: 0; }
        #ed-preview { width: auto; height: auto; max-width: 100%; max-height: 55vh; object-fit: contain; image-rendering: pixelated; }
        #ed-strip { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; flex-shrink: 0; }
        #ed-strip canvas {
            width: auto;
            height: 48px;
            flex-shrink: 0;
            cursor: pointer;
            background: #555;
            border: 2px solid transparent;
        }
        #ed-strip canvas.current { border-color: #f0fd01; }
        #ed-strip canvas.out { opacity: 0.25; }
        #ed-strip canvas.skipped { opacity: 0.25; outline: 2px solid #e74c3c; outline-offset: -2px; }
        #export-editor .ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
        #ed-info { opacity: 0.8; }

    </style>
</head>
<body>
    <div id="info">Splatoon 3 Weapon Viewer<div id="version">v0.8.1</div></div>
    <div id="ui">
        <div id="top-right">
            <div class="note" data-i18n="copyright.notice">Splatoon 3 및 관련 이미지·모델 © Nintendo. 비공식 팬 제작 뷰어입니다.</div>
            <div class="note" data-i18n="contact.feedback">버그 제보/의견 제시는 devilcookie0401@gmail.com으로</div>
            <div id="lang-picker"></div>
        </div>
        <div id="side-panel" class="collapsible left">
            <h2 id="list-title" data-i18n="list.title">무기</h2>
            <ul id="model-list"></ul>
            <button class="toggle-btn" aria-label="무기 목록 숨기기/펼치기" data-i18n-aria="list.toggle"></button>
        </div>
        <div id="left-bottom">
            <button id="anim-pause" data-i18n="anim.pause">⏸ 일시정지</button>
            <div id="color-picker-container" class="collapsible left">
                <button class="toggle-btn" aria-label="색 패널 숨기기/펼치기" data-i18n-aria="color.toggle"></button>
                <div class="color-item">
                <label data-i18n="color.ink">잉크 색</label>
                <input type="color" id="team-color-input" value="#fedc0c" list="ink-presets">
                <datalist id="ink-presets">
                    <option value="#1a1ab0"></option>
                    <option value="#d0bf08"></option>
                    <option value="#2cb822"></option>
                    <option value="#1ec0ad"></option>
                    <option value="#e38d24"></option>
                    <option value="#9026c6"></option>
                    <option value="#c12d74"></option>
                    <option value="#aef4f0"></option>
                </datalist>
                </div>
                <div class="color-item" id="skin-item" hidden>
                <label data-i18n="color.skin">피부</label>
                <button id="skin-button" class="preset-button" aria-label="피부" data-i18n-aria="color.skin"></button>
                <div id="skin-palette" class="preset-palette" hidden></div>
                </div>
                <div class="color-item" id="eye-item" hidden>
                <label data-i18n="color.eye">눈</label>
                <button id="eye-button" class="preset-button" aria-label="눈" data-i18n-aria="color.eye"></button>
                <div id="eye-palette" class="preset-palette" hidden></div>
                </div>
                <div class="color-item">
                <label data-i18n="color.bg">배경 색</label>
                <input type="color" id="bg-color-input" value="#a0a0a0" list="bg-presets">
                <datalist id="bg-presets">
                    <option value="#ffffff"></option>
                    <option value="#d0d0d0"></option>
                    <option value="#a0a0a0"></option>
                    <option value="#505050"></option>
                    <option value="#000000"></option>
                </datalist>
                </div>
            </div>
        </div>
